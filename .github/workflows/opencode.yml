name: opencode-pack

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xz-utils python3-pip
          python3 -m pip install --quiet cryptography

      - name: Signing key
        env:
          MARKET_SIGNING_KEY: ${{ secrets.MARKET_SIGNING_KEY }}
        run: |
          mkdir -p .keys
          printf '%s' "$MARKET_SIGNING_KEY" > .keys/market-signing-key.pem
          chmod 600 .keys/market-signing-key.pem

      - name: Build OC (binary + runtime) + signed index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build-opencode-bundle.py --version latest --out dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(python3 -c "import json;d=json.load(open('dist/index.json'));print('kernel-opencode-'+next(p['version'] for p in d['packs'] if p['id']=='kernel-opencode'))")
          ASSET=$(python3 -c "import json;d=json.load(open('dist/index.json'));print(next(p['archive']['url'] for p in d['packs'] if p['id']=='kernel-opencode').rsplit('/',1)[1])")
          if gh release view "$TAG" -R a2heng/androc-market >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ASSET" -R a2heng/androc-market --clobber
          else
            gh release create "$TAG" "dist/$ASSET" -R a2heng/androc-market \
              --title "OpenCode $TAG" \
              --notes "opencode binary + musl runtime; full pack only (no delta)"
          fi

      - name: Commit signed index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, subprocess
          repo = "a2heng/androc-market"
          for name in ("index.json", "index.json.sig"):
              data = open(f"dist/{name}", "rb").read()
              b64 = base64.b64encode(data).decode()
              sha = ""
              try:
                  sha = subprocess.check_output(
                      ["gh", "api", f"repos/{repo}/contents/{name}", "--jq", ".sha"],
                      text=True).strip()
              except subprocess.CalledProcessError:
                  pass
              cmd = ["gh", "api", f"repos/{repo}/contents/{name}", "-X", "PUT",
                     "-f", f"message=packs: update {name}", "-f", f"content={b64}"]
              if sha:
                  cmd += ["-f", f"sha={sha}"]
              subprocess.run(cmd, check=True)
          PY
